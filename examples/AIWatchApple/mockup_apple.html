<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>AIWatch Apple — 240 圆形屏 7 屏</title>
<style>
@font-face{font-family:'NS400';src:url('assets/fonts/noto-sans-sc-v40-chinese-simplified-regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'NS500';src:url('assets/fonts/noto-sans-sc-v40-chinese-simplified-500.ttf') format('truetype');font-weight:500}
@font-face{font-family:'NS700';src:url('assets/fonts/noto-sans-sc-v40-chinese-simplified-700.ttf') format('truetype');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05060a;color:#e8ecf4;font-family:system-ui,sans-serif;padding:28px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
p.sub{color:#8b93a3;font-size:12px;margin-bottom:22px}
.grid{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start}
figure{display:flex;flex-direction:column;align-items:center;gap:8px}
.watch{width:240px;height:240px;position:relative;background:#000;border-radius:50%;
  outline:3px solid #3a3d42;overflow:hidden;flex:none}
.screen{position:absolute;inset:0;border-radius:50%}
figcaption{font-size:12px;color:#9aa3b2}
figcaption b{color:#e8ecf4;font-size:13px}
.abs{position:absolute}
img{display:block}
:root{--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.38)}
.t2{color:var(--t2)} .t3{color:var(--t3)}
.center{left:0;right:0;text-align:center}
.f11{font-family:NS400;font-size:11px;line-height:1.2}
.f13{font-family:NS400;font-size:13px;line-height:1.2}
.f14{font-family:NS400;font-size:14px;line-height:1.25}
.f15{font-family:NS400;font-size:15px;line-height:1.3}
.f16{font-family:NS500;font-size:16px;line-height:1.25}
.f18{font-family:NS500;font-size:18px;line-height:1.25}
.f20{font-family:NS500;font-size:20px;line-height:1.25}
.f22{font-family:NS500;font-size:22px;line-height:1.25}
.f24b{font-family:NS700;font-size:24px;line-height:1.2}
.f36{font-family:NS700;font-size:36px;line-height:1.15}
.f44{font-family:NS700;font-size:44px;line-height:1.1}
.circle{position:absolute;width:44px;height:44px;border-radius:50%}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#5A5A5A}
.dot.on{background:#fff}
.hrow{position:absolute;left:40px;width:160px;height:36px;border-radius:14px;background:#141416}
</style></head><body>
<h1>AIWatch · Apple 风格 7 屏（240×240 圆形）</h1>
<p class="sub">home → clock → weather → health → steps → ai → settings · SquareLine shape=CIRCLE</p>
<div class="grid">

  <img class="abs" src="assets/images_apple/img_apple_icon_grid.png" style="left:51px;top:174px;width:24px;height:24px">
  <div class="circle" style="left:98px;top:164px;background:#FF2D8A"></div>
